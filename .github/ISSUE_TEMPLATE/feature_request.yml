name: Feature request
description: Suggest an improvement or new capability
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement. Control Tower is **local-only by design** — it binds to `127.0.0.1` and has no auth. Please keep that in mind when proposing features.

  - type: textarea
    id: problem
    attributes:
      label: Problem description
      description: What pain point does this solve? Who is affected and how often?
      placeholder: As a user, I find it frustrating that...
    validations:
      required: true

  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed solution
      description: How would you like Control Tower to behave differently?
      placeholder: It would be great if...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you've thought about and why they fall short.
    validations:
      required: false

  - type: checkboxes
    id: local-only-check
    attributes:
      label: Local-only fit
      description: Control Tower is intentionally local-first (127.0.0.1, no auth, no cloud backend). Proposals requiring multi-user support or a hosted backend need strong justification.
      options:
        - label: This feature works within a local-only, single-user dashboard
          required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Screenshots, mockups, links to similar implementations, or anything else that helps.
    validations:
      required: false

  - type: checkboxes
    id: duplicate-check
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues and this is not a duplicate
          required: true
